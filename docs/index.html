<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caliape Enterprise API - Swagger UI</title>
    <link rel="icon" type="image/ico" href="/assets/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        background: #f7f9fc;
      }
      .topbar {
        display: none;
      }
      .code-examples {
        margin: 12px 0 16px;
        border: 1px solid #dbe3f0;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
      }
      .code-examples-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid #e8edf5;
        background: #f8fbff;
      }
      .code-examples-header strong {
        font-size: 14px;
        color: #1e293b;
      }
      .copy-button {
        border: 1px solid #c9d7ee;
        background: #fff;
        color: #1d4ed8;
        border-radius: 7px;
        padding: 4px 9px;
        font-size: 12px;
        cursor: pointer;
      }
      .copy-button:hover {
        background: #eff6ff;
      }
      .tab-list {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid #e8edf5;
        flex-wrap: wrap;
      }
      .tab-btn {
        border: 1px solid #d5e1f1;
        border-radius: 999px;
        background: #fff;
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      .tab-btn.active {
        background: #eff6ff;
        color: #1d4ed8;
        border-color: #93c5fd;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
      .tab-panel pre {
        margin: 0;
        padding: 14px;
        background: #0f172a;
        color: #e2e8f0;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      function resolveExamplesUrl() {
        const baseUrl = new URL(window.location.href);
        const lastSegment = baseUrl.pathname.split("/").pop() || "";
        if (!baseUrl.pathname.endsWith("/") && !lastSegment.includes(".")) {
          baseUrl.pathname = `${baseUrl.pathname}/`;
        }
        return new URL("codeExamplesByOperation.js", baseUrl).toString();
      }

      function initializeSwaggerUi() {
        const codeExamplesByOperation = window.codeExamplesByOperation || {};

        function buildExampleTabs(operationKey, snippets) {
          const wrapper = document.createElement("section");
          wrapper.className = "code-examples";
          wrapper.dataset.operationExamples = operationKey;

          const header = document.createElement("div");
          header.className = "code-examples-header";

          const title = document.createElement("strong");
          title.textContent = "Ejemplos de cliente";

          const copyButton = document.createElement("button");
          copyButton.className = "copy-button";
          copyButton.type = "button";
          copyButton.textContent = "📋 Copiar";

          const tabs = document.createElement("div");
          tabs.className = "tab-list";

          const panelsContainer = document.createElement("div");

          const langs = [
            ["curl", "curl"],
            ["python", "Python"],
            ["typescript", "TypeScript"],
          ];

          let activeLang = "curl";
          const panelRefs = {};
          const tabRefs = {};

          const setActiveLang = (lang) => {
            activeLang = lang;
            langs.forEach(([key]) => {
              tabRefs[key].classList.toggle("active", key === lang);
              panelRefs[key].classList.toggle("active", key === lang);
            });
          };

          langs.forEach(([key, label]) => {
            const tabBtn = document.createElement("button");
            tabBtn.className = "tab-btn";
            tabBtn.type = "button";
            tabBtn.textContent = label;
            tabBtn.addEventListener("click", () => setActiveLang(key));
            tabRefs[key] = tabBtn;
            tabs.appendChild(tabBtn);

            const panel = document.createElement("div");
            panel.className = "tab-panel";
            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = snippets[key] || "";
            pre.appendChild(code);
            panel.appendChild(pre);
            panelRefs[key] = panel;
            panelsContainer.appendChild(panel);
          });

          copyButton.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(snippets[activeLang] || "");
              const previous = copyButton.textContent;
              copyButton.textContent = "✅ Copiado";
              setTimeout(() => {
                copyButton.textContent = previous;
              }, 1200);
            } catch {
              copyButton.textContent = "⚠️ Sin permisos";
            }
          });

          header.appendChild(title);
          header.appendChild(copyButton);
          wrapper.appendChild(header);
          wrapper.appendChild(tabs);
          wrapper.appendChild(panelsContainer);

          setActiveLang("curl");
          return wrapper;
        }

        function mountCodeExamples() {
          document.querySelectorAll(".opblock").forEach((opblock) => {
            if (opblock.querySelector("[data-operation-examples]")) {
              return;
            }

            const method = (opblock.getAttribute("data-method") || "").toLowerCase();
            const path = opblock.getAttribute("data-path") || "";
            const key = `${method} ${path}`;
            const snippets = codeExamplesByOperation[key];
            if (!snippets) {
              return;
            }

            const summary = opblock.querySelector(".opblock-summary");
            if (!summary) {
              return;
            }

            const tabs = buildExampleTabs(key, snippets);
            summary.insertAdjacentElement("afterend", tabs);
          });
        }

        window.ui = SwaggerUIBundle({
          url: "../enterprise-api-v1.yaml",
          dom_id: "#swagger-ui",
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          onComplete: () => {
            mountCodeExamples();
            const target = document.getElementById("swagger-ui");
            if (!target) {
              return;
            }
            const observer = new MutationObserver(() => mountCodeExamples());
            observer.observe(target, { childList: true, subtree: true });
          },
        });
      }

      const examplesScript = document.createElement("script");
      examplesScript.src = resolveExamplesUrl();
      examplesScript.onload = initializeSwaggerUi;
      examplesScript.onerror = initializeSwaggerUi;
      document.head.appendChild(examplesScript);
    </script>
  </body>
</html>
