<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caliape Recorder Integration API - OpenAPI Spec</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/assets/ios-light.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --primary-color: #263c2a;
        --secondary-color: #086d2f;
        --text-color: #333;
        --light-bg: #f8f9fa;
        --white: #fff;
        --light-gray: #e9ecef;
        --box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        background: var(--light-bg);
        color: var(--text-color);
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 36px 20px 52px;
      }
      h1 {
        margin: 0 0 12px;
        color: var(--primary-color);
      }
      p {
        margin: 0 0 14px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-weight: 600;
        color: var(--white);
        background: var(--primary-color);
        border-radius: 999px;
        padding: 9px 14px;
      }
      .btn:hover {
        background: var(--secondary-color);
      }
      .panel {
        background: var(--white);
        border: 1px solid var(--light-gray);
        border-radius: 12px;
        box-shadow: var(--box-shadow);
        overflow: hidden;
      }
      .panel-head {
        padding: 10px 14px;
        border-bottom: 1px solid var(--light-gray);
      }
      pre {
        margin: 0;
        padding: 14px;
        overflow: auto;
        max-height: 75vh;
        font-size: 12px;
        line-height: 1.5;
        background: #0f172a;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenAPI spec</h1>
      <p>Vista del archivo <code>recorder-api.yaml</code>.</p>
      <div class="actions">
        <a class="btn" href="/docs/">Abrir Swagger UI</a>
        <a class="btn" href="/recorder-api.yaml" download>Descargar YAML</a>
        <a class="btn" href="/">Volver al inicio</a>
      </div>

      <section class="panel">
        <div class="panel-head"><strong>recorder-api.yaml</strong></div>
        <pre><code id="yaml-content">Cargando...</code></pre>
      </section>
    </main>

    <script>
      async function loadSpec() {
        const content = document.getElementById("yaml-content");
        try {
          const response = await fetch("/recorder-api.yaml", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          content.textContent = await response.text();
        } catch (error) {
          content.textContent = "No se pudo cargar el archivo: " + error.message;
        }
      }
      loadSpec();
    </script>
  </body>
</html>
